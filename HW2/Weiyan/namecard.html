<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namecard</title>
    <link rel="stylesheet" href="namecard.css">
</head>
<body>
    <div class="container">
        <img class="avatar" src="https://i.pravatar.cc/80" alt="Jane Doe's Photo">
        <div class="info">
            <h1 class="name">Jane Doe</h1>
            <h2 class="job-title">Front-end Engineer</h2>
        </div>
        <button class="follow-btn">Follow</button>
    </div>
</body>
</html>
