<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Question 2 - Name Card (Flexbox)</title>
    <link rel="stylesheet" href="hw_2.css" />
  </head>
  <body id="question2" class="flex-card">
    <div class="card">
      <img class="avatar" src="https://i.pravatar.cc/80" alt="Jane Doe avatar" />

    </div>
  </body>
