<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW2 CSS Coding</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <section class="panel">
      <h1>Flexbox Layout</h1>
      <div class="layout flex-layout">
        <header>Header</header>
        <div class="content-row">
          <nav>Nav</nav>
          <article>Article</article>
          <aside>Aside</aside>
        </div>
        <footer>Footer</footer>
      </div>
    </section>

    <section class="panel">
      <h1>Grid Layout</h1>
      <div class="layout grid-layout">
        <header>Header</header>
        <nav>Nav</nav>
        <article>Article</article>
        <aside>Aside</aside>
        <footer>Footer</footer>
      </div>
    </section>

    <section class="card-stage">
      <div class="name-card">
        <img src="https://i.pravatar.cc/80" alt="Jane Doe avatar">
        <div class="profile">
          <h2>Jane Doe</h2>
          <p>Front-end Engineer</p>
        </div>
        <button>Follow</button>
      </div>
    </section>

    <p class="tailwind-link"><a href="tailwind.html">Tailwind Practice</a></p>
  </main>
</body>
</html>
