<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grid Layout</title>

    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }

      .container {
        width: 800px;
        margin: 40px auto;
        display: grid;
        grid-template-columns: 160px 1fr 160px;
        grid-template-rows: 100px 300px 60px;
        grid-template-areas:
          "header header header"
          "nav article aside"
          "footer footer footer";
      }

      header {
        grid-area: header;
        background-color: #9acd32;
        padding: 20px;
      }

      nav {
        grid-area: nav;
        background-color: #f5f5dc;
        padding: 20px;
      }

      article {
        grid-area: article;
        background-color: white;
        padding: 20px;
      }

      aside {
        grid-area: aside;
        background-color: #f5f5dc;
        padding: 20px;
      }

      footer {
        grid-area: footer;
        background-color: yellow;
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>Header</header>
      <nav>Nav</nav>
      <article>Article</article>
      <aside>Aside</aside>
      <footer>Footer</footer>
    </div>
  </body>
</html>
