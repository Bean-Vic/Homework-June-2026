<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Registration Form" />
    <title>Registration Form</title>
  </head>

  <body>
    <h1>Registration Form</h1>

    <p>
      <em>Fill out the form below to register for the workshop.</em>
    </p>
    <form>
      <p>
        <label for="sessionDate">Preferred Session Date:</label>
        <input type="date" id="sessionDate" name="sessionDate" />
      </p>

      <p>
        <label for="tshirtSize">T-shirt Size:</label>
        <select id="tshirtSize" name="tshirtSize">
          <option value="small">Small</option>
          <option value="medium">Medium</option>
          <option value="large">Large</option>
          <option value="x-large">X-large</option>
        </select>
      </p>

      <p>
        <label for="experienceLevel">Experience Level:</label>
        <select id="experienceLevel" name="experienceLevel">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </p>

      <p>
        <label for="fileupload">Upload Files:</label>
        <input type="file" id="fileupload" name="fileupload" multiple />
      </p>

      <p>
        <a href="https://example.com/" target="_blank" rel="noreferrer nofollow"
          >Visit our Community Hub</a
        >
      </p>

      <p>
        <button type="submit">Submit Registration</button>
      </p>
    </form>
  </body>
</html>
