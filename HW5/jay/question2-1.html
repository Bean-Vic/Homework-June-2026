<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HW5 Question 2-1: Parts 1–3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f5f0e6;
        --ink: #1f1b16;
        --rule: #c9bda6;
        --accent: #b3401e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "IBM Plex Mono", monospace;
        background: var(--paper);
        background-image: repeating-linear-gradient(
          transparent,
          transparent 31px,
          rgba(31, 27, 22, 0.04) 32px
        );
        color: var(--ink);
        margin: 0;
        padding: 3rem 1.5rem;
        min-height: 100vh;
      }

      main {
        max-width: 860px;
        margin: 0 auto;
      }

      h1 {
        font-family: "Fraunces", serif;
        font-weight: 900;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1;
        margin: 0 0 0.5rem;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 0 0 2.5rem;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--accent);
      }

      .part {
        background: rgba(255, 255, 255, 0.45);
        border: 1px solid var(--rule);
        border-top: 3px solid var(--ink);
        padding: 1.5rem;
        margin-bottom: 2.5rem;
      }

      .part > h2 {
        font-family: "Fraunces", serif;
        font-weight: 900;
        font-size: 1.8rem;
        margin: 0 0 1rem;
      }

      h3 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 1.2rem;
        margin: 1.5rem 0 0.5rem;
        padding-bottom: 0.25rem;
        border-bottom: 1px solid var(--rule);
      }

      button {
        font: inherit;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 0.6rem 1.5rem;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      button:hover:enabled {
        background: var(--accent);
        border-color: var(--accent);
      }

      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }

      input {
        font: inherit;
        padding: 0.6rem 0.9rem;
        border: 1px solid var(--ink);
        border-radius: 0;
        background: #fff;
        color: var(--ink);
      }

      input:focus {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }

      #search-form {
        display: flex;
        gap: 0.75rem;
      }

      #user-id-input {
        flex: 1;
        max-width: 320px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 1rem;
        font-size: 0.85rem;
        background: #fff;
      }

      th,
      td {
        border: 1px solid var(--rule);
        padding: 0.5rem 0.75rem;
        text-align: left;
      }

      th {
        background: var(--ink);
        color: var(--paper);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      tbody tr:nth-child(even) {
        background: rgba(245, 240, 230, 0.6);
      }

      .kv-list {
        list-style: none;
        margin: 0 0 1rem;
        padding: 0.75rem 1rem;
        background: #fff;
        border: 1px solid var(--rule);
        font-size: 0.85rem;
        line-height: 1.7;
      }

      .kv-key {
        color: var(--accent);
        font-weight: 500;
      }

      .status {
        opacity: 0.7;
      }

      .error {
        color: var(--accent);
        font-weight: 500;
        border-left: 4px solid var(--accent);
        padding-left: 0.75rem;
      }

      p[role="status"] {
        min-height: 1.5rem;
        margin: 1rem 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Question 2-1</h1>
      <p class="subtitle">jsonplaceholder records · HW5 · Parts 1–3</p>

      <section class="part" id="part-1">
        <h2>Part 1</h2>
        <button id="load-users-button" type="button">Load Users</button>
        <div id="users-container"></div>
      </section>

      <section class="part" id="part-2">
        <h2>Part 2</h2>
        <form id="search-form">
          <input
            id="user-id-input"
            type="text"
            inputmode="numeric"
            placeholder="Enter User ID"
            aria-label="User ID"
          />
          <button type="submit">Search</button>
        </form>
        <p id="search-message" role="status"></p>
        <h3>User Info</h3>
        <div id="user-info"></div>
        <h3>User Posts</h3>
        <div id="user-posts"></div>
        <h3>User Todos</h3>
        <div id="user-todos"></div>
      </section>

      <section class="part" id="part-3">
        <h2>Part 3</h2>
        <button id="delayed-request-button" type="button">
          Send Delayed Request
        </button>
        <p id="delayed-message" role="status"></p>
      </section>
    </main>

    <script src="question2-1.js"></script>
  </body>
</html>
