<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body style="margin:auto">
    <header style="font-weight:bold;font-size:xx-large">Community Workshop Registration</header>
    <h3 style="font-size:small">Note: please submit this form at least 14 days before your chosen session.</h3>
    <div class="personalDetials" style="padding:1rem;margin:1rem;">
        <legend>personal Details</legend>

        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Text your name"/>
        <br>

        <label for="address">address</label>
        <input id="address" type="text" placeholder="Street,City, State"/>
         <br>

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com"/>
         <br>

        <label for="number">Phone Number</label>
        <input id="number" type="number" placeholder="123-456-7890"/>
         <br>





    </div>
</body>
</html>
