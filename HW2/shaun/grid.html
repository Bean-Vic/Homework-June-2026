<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Layout</title>

  <style>
    .container {
      width: 90%;
      margin: 30px auto;

      display: grid;
      grid-template-columns: 20% 60% 20%;
      grid-template-rows: 150px 550px 70px;
    }

    header {
      grid-column: 1 / 4;
      background-color: yellowgreen;
      padding: 30px;
      font-size: 32px;
      color: gray;
      font-weight: bold;
    }

    nav {
      background-color: beige;
      padding: 30px;
      font-size: 32px;
      color: gray;
      font-weight: bold;
    }

    article {
      background-color: white;
      padding: 30px;
      font-size: 32px;
      color: gray;
      font-weight: bold;
    }

    aside {
      background-color: beige;
      padding: 30px;
      font-size: 32px;
      color: gray;
      font-weight: bold;
    }

    footer {
      grid-column: 1 / 4;
      background-color: yellow;
      padding: 30px;
      font-size: 32px;
      color: gray;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>Header</header>
    <nav>Nav</nav>
    <article>Article</article>
    <aside>Aside</aside>
    <footer>Footer</footer>
  </div>

</body>
</html>
