<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Homework</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>

    <!-- Part 1 -->
    <section>
      <h2>Part 1</h2>

      <button id="load-users-button">Load Users</button>
      <p id="users-message"></p>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>City</th>
          </tr>
        </thead>

        <tbody id="users-body"></tbody>
      </table>
    </section>

    <!-- Part 2 -->
    <section>
      <h2>Part 2</h2>

      <div class="search-area">
        <input
          type="number"
          id="user-id"
          min="1"
          placeholder="Enter User ID"
        >
        <button id="search-button">Search</button>
      </div>

      <p id="search-message"></p>

      <h3>User Info</h3>
      <div id="user-info"></div>

      <h3>User Posts</h3>
      <div id="user-posts"></div>

      <h3>User Todos</h3>
      <div id="user-todos"></div>
    </section>

    <!-- Part 3 -->
    <section>
      <h2>Part 3</h2>

      <button id="delayed-button">
        Send Delayed Request
      </button>

      <p id="delayed-message"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
