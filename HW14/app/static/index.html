<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fashion Inspiration Library</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header><h1>Fashion Inspiration Library</h1></header>
  <main>
    <section id="upload">
      <h2>Upload</h2>
      <form id="upload-form">
        <input type="file" name="file" accept="image/*" required />
        <input type="text" name="country" placeholder="country" />
        <input type="text" name="city" placeholder="city" />
        <input type="text" name="continent" placeholder="continent" />
        <input type="number" name="year" placeholder="year" />
        <input type="number" name="month" placeholder="month" />
        <input type="text" name="season" placeholder="season" />
        <input type="text" name="designer" placeholder="designer" />
        <button type="submit">Upload &amp; classify</button>
      </form>
      <p id="upload-status"></p>
    </section>
    <section id="controls">
      <input id="search" type="search" placeholder="Search descriptions &amp; notes…" />
      <div id="filters"></div>
      <button id="clear">Clear filters</button>
    </section>
    <section id="grid"></section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
