<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name Card</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f0f2f5;
      font-family: sans-serif;
    }

    .name-card {
      width: min(392px, calc(100vw - 40px));
      min-height: 102px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 14px 16px 16px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
    }

    .avatar {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
      border-radius: 50%;
      object-fit: cover;
      transition: transform 180ms ease;
    }

    .avatar:hover {
      transform: scale(1.08);
    }

    .profile {
      min-width: 0;
      flex: 1;
    }

    .name {
      margin: 0;
      color: #050505;
      font-size: 20px;
      line-height: 1.15;
      font-weight: 700;
    }

    .role {
      margin: 4px 0 0;
      color: #4b5563;
      font-size: 15px;
      line-height: 1.25;
    }

    .follow-button {
      width: 93px;
      height: 31px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 4px;
      background: #007bff;
      color: #ffffff;
      font: 700 14px/1 sans-serif;
      cursor: pointer;
      transition: background-color 160ms ease;
    }

    .follow-button:hover {
      background: #005fc7;
    }

    @media screen and (max-width: 600px) {
      .name-card {
        width: min(412px, calc(100vw - 48px));
        min-height: 278px;
        flex-direction: column;
        justify-content: center;
        gap: 0;
        padding: 20px 56px 18px;
        text-align: center;
      }

      .avatar {
        width: 88px;
        height: 88px;
        flex-basis: 88px;
        margin-bottom: 34px;
      }

      .profile {
        width: 100%;
      }

      .name {
        font-size: 24px;
        line-height: 1.12;
      }

      .role {
        margin-top: 4px;
        font-size: 20px;
        line-height: 1.2;
      }

      .follow-button {
        width: 100%;
        height: 46px;
        margin-top: 18px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="name-card" aria-label="Name card">
    <img class="avatar" src="https://i.pravatar.cc/80" alt="Jane Doe">
    <section class="profile">
      <h1 class="name">Jane Doe</h1>
      <p class="role">Front-end Engineer</p>
    </section>
    <button class="follow-button" type="button">Follow</button>
  </main>
</body>
</html>
