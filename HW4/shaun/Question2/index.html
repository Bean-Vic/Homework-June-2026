<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Tabs</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="tabs">
    <div class="tab-buttons" id="tab-buttons">
      <button class="tab-button active" data-city="london">London</button>
      <button class="tab-button" data-city="paris">Paris</button>
      <button class="tab-button" data-city="tokyo">Tokyo</button>
    </div>

    <div class="tab-content active" id="london">
      <h2>London</h2>
      <p>London is the capital city of England.</p>
    </div>

    <div class="tab-content" id="paris">
      <h2>Paris</h2>
      <p>Paris is the capital of France.</p>
    </div>

    <div class="tab-content" id="tokyo">
      <h2>Tokyo</h2>
      <p>Tokyo is the capital of Japan.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
