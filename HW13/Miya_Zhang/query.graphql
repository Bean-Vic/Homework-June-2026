query GetOrder($orderId: ID!) {
  order(orderId: $orderId) {
    id
    status
    createdAt
    total
    customer {
      id
      name
      email
    }
    lineItems {
      id
      quantity
      unitPrice
      product {
        id
        name
        sku
        category
        description
      }
    }
  }
}
