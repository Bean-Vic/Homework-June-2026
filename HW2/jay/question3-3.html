<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tailwind Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <!--
      body: full screen height + center the box both ways
        h-screen          -> page takes the full height of the screen
        flex              -> make body a flex container
        items-center      -> vertical centering
        justify-center    -> horizontal centering

      box:
        bg-blue-500       -> blue background
        text-white        -> white text
        p-8               -> padding on all sides
        rounded-lg        -> rounded corners
    -->
    <div class="h-screen flex items-center justify-center">
      <div class="bg-blue-500 text-white p-8 rounded-lg">
        Hello Tailwind
      </div>
    </div>
  </body>
</html>
