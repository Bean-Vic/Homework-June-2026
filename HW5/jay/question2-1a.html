<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HW5 Question 2-1a: Users Table</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        color: #222;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 0.5rem 0.75rem;
        text-align: left;
      }

      th {
        background-color: #f0f0f0;
      }

      tbody tr:nth-child(even) {
        background-color: #fafafa;
      }

      .status {
        color: #555;
      }

      .error {
        color: #b00020;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Users</h1>
    <div id="users-container"></div>
    <script src="question2-1a.js"></script>
  </body>
</html>
