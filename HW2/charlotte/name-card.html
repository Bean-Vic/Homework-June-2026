<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Card</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: sans-serif;
        background: #f0f2f5;
      }

      .card {
        width: min(90%, 420px);
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 28px;
        border-radius: 12px;
        background: white;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }

      .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        transition: transform 0.2s ease;
      }

      .avatar:hover {
        transform: scale(1.08);
      }

      .info {
        flex: 1;
      }

      .info h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }

      .info p {
        margin: 0 0 18px;
        color: #666;
      }

      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 18px;
        color: white;
        background: #007bff;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      @media screen and (max-width: 600px) {
        .card {
          flex-direction: column;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <section class="card">
      <img class="avatar" src="https://i.pravatar.cc/80" alt="User avatar" />

      <div class="info">
        <h1>Charlotte</h1>
        <p>Frontend Developer</p>
        <button type="button">Follow</button>
      </div>
    </section>
  </body>
</html>
